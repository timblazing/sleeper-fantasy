name: Deploy

# Every push to main is checked, built with OpenNext and deployed to the `sleeper-fantasy` Worker,
# which serves sleeper.blasingame.dev. A failed check leaves the current version live.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Deploys run one at a time and in order; a newer push waits rather than cancelling a deploy midway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build and deploy
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
